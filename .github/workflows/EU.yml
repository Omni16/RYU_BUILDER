name: RYU BUILDER EU
on:
  workflow_dispatch:
    inputs:
      URL:
        description: "XIAOMI.EU URL"
        required: true
      SFU:
        description: "SF UPLOADER"
        type: boolean
        default: 'true'
      EXT4:
        description: "FORCE EXT4"
        type: boolean
        default: 'false'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROM_URL: ${{ github.event.inputs.URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check free disk space
        id: diskcheck
        run: |
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free disk space: ${FREE_GB}GB"
          echo "need_cleanup=$( [ "$FREE_GB" -lt 50 ] && echo true || echo false )" >> $GITHUB_OUTPUT
      - name: Maximize build disk space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
      - name: Start SSH Agent & Add Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_REPO_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Setup build environment
        run: |
          sudo timedatectl set-timezone UTC
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            android-sdk-libsparse-utils \
            openjdk-17-jdk-headless \
            openssh-client p7zip-full \
            python3 python-is-python3 python3-pip \
            zip zipalign > /dev/null 2>&1
          pip install --quiet \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib > /dev/null 2>&1
          DATE=$(TZ=UTC date +"%y%m%d")
          DEVICE=""
          if [[ "$ROM_URL" == *"drive.google.com"* ]]; then
            RYU_NAME="RYU_XIAOMI_EU${DATE}"
          else
            ROM_NAME="$(basename "${ROM_URL%/download}")"
            if [[ "$ROM_NAME" == *_OS* ]]; then
              if [[ "$ROM_NAME" =~ ^xiaomi\.eu_([^_]+)_(OS[0-9.]+)\.([A-Z0-9]+)_([0-9]+)(_[a-f0-9]+)?\.zip$ ]]; then
                  DEVICE="${BASH_REMATCH[1]^^}"
                  OS_VER="${BASH_REMATCH[2]}"
                  REGION="${BASH_REMATCH[3]}"
                  RYU_NAME="RYUOS_${DEVICE}_${OS_VER}.${REGION}_EU${DATE}"
              else
                RYU_NAME="RYUOS_XIAOMI_EU${DATE}"
              fi
            elif [[ "$ROM_NAME" == *_V14* ]]; then
              if [[ "$ROM_NAME" =~ ^xiaomi\.eu_multi_([A-Za-z0-9]+)(_[A-Za-z0-9]+)?_(V14\.[0-9.]+)\.([A-Z0-9]+)_v14-([0-9]+)\.zip$ ]]; then
                  DEVICE="${BASH_REMATCH[1]^^}"
                  OS_VER="${BASH_REMATCH[3]}"
                  REGION="${BASH_REMATCH[4]}"
                  RYU_NAME="RYUUI_${DEVICE}_${OS_VER}.${REGION}_EU${DATE}"
              else
                RYU_NAME="RYUUI_XIAOMI_EU${DATE}"
              fi
            else
              echo "::error::Unable to parse ROM name: $ROM_NAME"
              exit 1
            fi
            echo "DEVICE=${DEVICE,,}" >> $GITHUB_ENV
          fi
          echo "RYU_NAME=$RYU_NAME" >> $GITHUB_ENV
          echo "RYU_NAME=$RYU_NAME | DEVICE=${DEVICE:-N/A}"
      - name: Download ROM
        run: |
          DEST_DIR="$GITHUB_WORKSPACE/ROM"
          DEST_FILE="$DEST_DIR/${RYU_NAME}.zip"
          mkdir -p "$DEST_DIR"
          download_gdrive() {
            echo "::group::Downloading from Google Drive (1DM+ Engine: 32 threads, max 128)"
            timeout 9000 python3 "$GITHUB_WORKSPACE/tools/fast_download.py" \
              "$ROM_URL" \
              -o "$DEST_FILE" \
              --threads 32 \
              --max-threads 128
            echo "::endgroup::"
          }
          download_sourceforge() {
            local sf_path
            sf_path=$(python3 - <<'EOF'
          from urllib.parse import urlparse
          import os, sys
          p = urlparse(os.environ["ROM_URL"])
          parts = p.path.split("/")
          proj  = parts[2]
          fpath = "/".join(parts[4:]).removesuffix("/download")
          print(f"{proj}/{fpath}")
          EOF
            ) || { echo "::error::Failed to parse SourceForge URL"; return 1; }
            local -a mirrors=(
              "https://cfhcable.dl.sourceforge.net/project"
              "https://pilotfiber.dl.sourceforge.net/project"
              "https://gigenet.dl.sourceforge.net/project"
              "https://netcologne.dl.sourceforge.net/project"
              "https://deac-riga.dl.sourceforge.net/project"
            )
            for mirror in "${mirrors[@]}"; do
              echo "::group::Trying mirror (1DM+ Engine): $mirror"
              if timeout 1800 python3 "$GITHUB_WORKSPACE/tools/fast_download.py" \
                  "${mirror}/${sf_path}?viasf=1" \
                  -o "$DEST_FILE" \
                  --threads 32 \
                  --max-threads 128; then
                echo "::endgroup::"
                return 0
              fi
              echo "Mirror failed, trying next..."
              echo "::endgroup::"
              rm -f "$DEST_FILE"
            done
            echo "::error::All SourceForge mirrors failed"
            return 1
          }
          case "$ROM_URL" in
            *"drive.google.com"*)       download_gdrive ;;
            *"sourceforge.net/projects/"*) download_sourceforge ;;
            *)
              echo "::group::Downloading Direct Link (1DM+ Engine: 32 threads, max 128)"
              timeout 9000 python3 "$GITHUB_WORKSPACE/tools/fast_download.py" \
                "$ROM_URL" \
                -o "$DEST_FILE" \
                --threads 32 \
                --max-threads 128
              echo "::endgroup::"
              ;;
          esac
          [ -s "$DEST_FILE" ] || { echo "::error::Downloaded file is missing or empty"; exit 1; }
          echo "Download complete: $DEST_FILE ($(du -h "$DEST_FILE" | cut -f1))"
      - name: Clone RYU BUILD sources
        run: |
          RYU_HOME="/home/runner/work/RYU_BUILD/RYU_BUILD"
          echo "RYU_HOME=$RYU_HOME" >> $GITHUB_ENV
          git clone -b main --depth=1 git@github.com:Omni16/RYU_BUILD.git "$RYU_HOME"
          mv -f "$GITHUB_WORKSPACE/ROM" "$RYU_HOME/ROM"
          sudo chmod -R +x "$RYU_HOME"
      - name: Build ProjectRYU ROM
        run: |
          sudo bash "$RYU_HOME/build.sh" "$GITHUB_ENV" "$RYU_NAME" "${{ github.event.inputs.EXT4 }}"
      - name: Upload ROM to Clouds
        run: |
          cd "$RYU_HOME/tools"

          # PixelDrain upload function
          pd_upload() {
            if [ -n "${{ secrets.PIXELDRAIN_API }}" ] && [ -f "$ROM_OUTPUT" ]; then
              echo "::group::Uploading to PixelDrain..."
              PD_RESP=$(curl -s -w "\n%{http_code}" -u ":${{ secrets.PIXELDRAIN_API }}" -X PUT -T "$ROM_OUTPUT" "https://pixeldrain.com/api/file/${RYU_NAME}.zip")
              HTTP_CODE=$(echo "$PD_RESP" | tail -n1)
              BODY=$(echo "$PD_RESP" | sed '$d')
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                FILE_ID=$(echo "$BODY" | jq -r '.id // empty')
                if [ -n "$FILE_ID" ]; then
                  PD_LINK="https://pixeldrain.com/u/${FILE_ID}"
                  echo "PixelDrain Upload Success: $PD_LINK"
                  echo "RYU_LINK=$PD_LINK" >> $GITHUB_ENV
                  echo "PD_LINK=$PD_LINK" >> $GITHUB_ENV
                fi
              else
                echo "::warning::PixelDrain upload failed with HTTP $HTTP_CODE: $BODY"
              fi
              echo "::endgroup::"
            fi
          }

          # SourceForge upload function
          sf_upload() {
            local src="$1" dest_path="$2"
            if [ "${{ github.event.inputs.SFU }}" = "true" ] && [ -n "${{ secrets.SF_SSH_KEY }}" ]; then
              echo "${{ secrets.SF_SSH_KEY }}" > key
              chmod 0600 key
              rsync -a --partial -q \
                -e "ssh -i key -o StrictHostKeyChecking=no" \
                "$src" \
                "zuri1503@frs.sourceforge.net:/home/frs/project/projectzk/ProjectRYU/${dest_path}/" \
                && {
                  echo "Uploaded $(basename "$src") -> SF:$dest_path"
                  echo "RYU_LINK=https://sourceforge.net/projects/projectzk/files/ProjectRYU/$dest_path" >> $GITHUB_ENV
                } || echo "::warning::rsync failed: $src -> $dest_path"
              rm -f key
            fi
          }

          # Google Drive upload function
          gd_upload() {
            local folder_id="$1"
            if [ -n "${{ secrets.TOKEN_PICKLE3 }}" ] && [ -n "${{ secrets.UPLOADER }}" ]; then
              echo "${{ secrets.TOKEN_PICKLE3 }}" | base64 -d > token.pickle
              echo "${{ secrets.UPLOADER }}" | base64 -d > upload.py
              chmod 0600 token.pickle upload.py
              python upload.py --folder-id "$folder_id" "$ROM_OUTPUT" || echo "::warning::GDrive upload failed"
              rm -f token.pickle upload.py
            fi
          }

          # Always upload to PixelDrain when API key is available
          pd_upload

          case "$ROM_VER" in
            V14)
              sf_upload "$ROM_OUTPUT" "RYU-EU/RYUUI14"
              gd_upload "1tizKMOAFgdXasSpwbQkOrEqUV3tmPsqX"
              ;;
            OS1|OS1_A13)
              sf_upload "$ROM_OUTPUT" "RYU-EU/RYUOS1"
              gd_upload "1Tavtb77QqtI2T2goZkGOBlJemCYC3fcO"
              ;;
            OS2|OS2_A14)
              sf_upload "$ROM_OUTPUT" "RYU-EU/RYUOS2"
              gd_upload "19fNv0g0KmBnIwWzAZn0b3cuc2n5frQrv"
              ;;
            OS3|OS3_A15)
              sf_upload "$ROM_OUTPUT" "RYU-EU/RYUOS3"
              gd_upload "125CzcpuFCY49kmJpp5ICfKKa9P8FhIel"
              ;;
            *)
              echo "::warning::Unknown ROM_VER=$ROM_VER, skipping SF/GD upload"
              ;;
          esac

      - name: Telegram Notification
        if: env.RYU_LINK != '' && secrets.TELEGRAM_BOT_TOKEN != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg chat "-1002030539146" \
            --arg text "✅ <b>NEW BUILD: <a href='${RYU_LINK}'>${RYU_NAME}.zip</a></b>" \
            '{ chat_id: $chat, text: $text, parse_mode: "HTML" }')
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
