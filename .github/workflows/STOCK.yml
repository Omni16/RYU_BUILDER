name: RYU BUILDER STOCK
on:
  workflow_dispatch:
    inputs:
      URL:
        description: "OTA PACKAGE URL"
        required: true
      SFU:
        description: "SOURCEFORGE UPLOADER"
        type: boolean
        default: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROM_URL: ${{ github.event.inputs.URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check free disk space
        id: diskcheck
        run: |
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free disk space: ${FREE_GB}GB"
          echo "need_cleanup=$( [ "$FREE_GB" -lt 50 ] && echo true || echo false )" >> $GITHUB_OUTPUT
      - name: Maximize build disk space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'
      - name: Start SSH Agent & Add Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_REPO_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Setup build environment
        run: |
          sudo timedatectl set-timezone UTC
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jdk-headless \
            openssh-client p7zip-full \
            python3 python-is-python3 python3-pip \
            python3-lz4 python3-zstandard \
            zip zipalign > /dev/null 2>&1
          sudo pip install --quiet --break-system-packages lz4 zstandard \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib > /dev/null 2>&1 || pip install --quiet --break-system-packages lz4 zstandard \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib > /dev/null 2>&1
          DATE=$(TZ=UTC date +"%y%m%d")
          ROM_NAME="$(basename "${ROM_URL%%\?*}")"
          DEVICE=""
          ROM_VER=""
          RYU_NAME=""
          if [[ "$ROM_NAME" == *"-OS"* ]]; then
            if [[ "$ROM_NAME" =~ ^([a-z0-9]+)-ota_full-(OS[0-9.]+)\.([A-Z0-9]+)-user-([0-9.]+)-.*\.zip$ ]]; then
              DEVICE="${BASH_REMATCH[1]^^}"
              OS_VER="${BASH_REMATCH[2]}"
              REGION="${BASH_REMATCH[3]}"
              ROM_VER="${OS_VER%%.*}"
              RYU_NAME="RYUOS_${DEVICE}_${OS_VER}.${REGION}_CN${DATE}"
            elif [[ "$ROM_NAME" =~ ^([a-z0-9]+)_[a-z_]+-ota_full-(OS[0-9.]+)\.([A-Z0-9]+)-user-([0-9.]+)-.*\.zip$ ]]; then
              DEVICE="${BASH_REMATCH[1]^^}"
              OS_VER="${BASH_REMATCH[2]}"
              REGION="${BASH_REMATCH[3]}"
              ROM_VER="${OS_VER%%.*}"
              RYU_NAME="RYUOS_${DEVICE}_${OS_VER}.${REGION}_MI${DATE}"
            else
              echo "::warning::Regex did not match, using fallback name"
              RYU_NAME="RYUOS_${DATE}"
            fi
          else
            echo "::error::Unable to parse ROM name: $ROM_NAME"
            exit 1
          fi
          {
            echo "RYU_NAME=$RYU_NAME"
            echo "DEVICE=${DEVICE,,}"
            echo "ROM_VER=$ROM_VER"
          } >> $GITHUB_ENV
          echo "RYU_NAME=$RYU_NAME | DEVICE=${DEVICE,,} | ROM_VER=$ROM_VER"
      - name: Download ROM files
        run: |
          DEST_DIR="$GITHUB_WORKSPACE/ROM"
          DEST_FILE="$DEST_DIR/${RYU_NAME}.zip"
          echo "::group::Downloading OTA ROM (1DM+ Engine: 64 threads, max 128)"
          mkdir -p "$DEST_DIR"
          timeout 3600 python3 "$GITHUB_WORKSPACE/tools/fast_download.py" \
            "$ROM_URL" \
            -o "$DEST_FILE" \
            --connect-timeout 10 \
            --threads 64 \
            --max-threads 128 \
            || { echo "::error::OTA ROM download failed"; exit 1; }
          echo "::endgroup::"
          [ -s "$DEST_FILE" ] \
            || { echo "::error::Downloaded ROM is missing or empty"; exit 1; }
          echo "Download complete: $(du -h "$DEST_FILE" | cut -f1)"
      - name: Clone RYU AUTO BUILD sources
        run: |
          RYU_HOME="/home/runner/work/RYU_BUILD/RYU_BUILD"
          echo "RYU_HOME=$RYU_HOME" >> $GITHUB_ENV
          git clone -b stock --depth=1 git@github.com:Omni16/RYU_BUILD.git "$RYU_HOME"
          mv -f "$GITHUB_WORKSPACE/ROM" "$RYU_HOME/ROM"
          sudo chmod -R +x "$RYU_HOME"
      - name: Build ProjectRYU ROM
        run: |
          sudo bash "$RYU_HOME/build.sh" "$GITHUB_ENV" "$RYU_NAME"
      - name: Upload ROM to Clouds
        run: |
          cd "$RYU_HOME/tools"

          # PixelDrain upload function
          pd_upload() {
            if [ -n "${{ secrets.PIXELDRAIN_API }}" ] && [ -f "$ROM_OUTPUT" ]; then
              echo "::group::Uploading to PixelDrain..."
              PD_RESP=$(curl -s -w "\n%{http_code}" -u ":${{ secrets.PIXELDRAIN_API }}" -X PUT -T "$ROM_OUTPUT" "https://pixeldrain.com/api/file/${RYU_NAME}.zip")
              HTTP_CODE=$(echo "$PD_RESP" | tail -n1)
              BODY=$(echo "$PD_RESP" | sed '$d')
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                FILE_ID=$(echo "$BODY" | jq -r '.id // empty')
                if [ -n "$FILE_ID" ]; then
                  PD_LINK="https://pixeldrain.com/u/${FILE_ID}"
                  echo "PixelDrain Upload Success: $PD_LINK"
                  echo "RYU_LINK=$PD_LINK" >> $GITHUB_ENV
                  echo "PD_LINK=$PD_LINK" >> $GITHUB_ENV
                fi
              else
                echo "::warning::PixelDrain upload failed with HTTP $HTTP_CODE: $BODY"
              fi
              echo "::endgroup::"
            fi
          }

          # SourceForge upload function
          sf_upload() {
            local src="$1" dest_path="$2"
            if [ "${{ github.event.inputs.SFU }}" = "true" ] && [ -n "${{ secrets.SF_SSH_KEY }}" ]; then
              echo "${{ secrets.SF_SSH_KEY }}" > key
              chmod 0600 key
              rsync -a --partial -q \
                -e "ssh -i key -o StrictHostKeyChecking=no" \
                "$src" \
                "zuri1503@frs.sourceforge.net:/home/frs/project/projectzk/ProjectRYU/${dest_path}/" \
                && {
                  echo "Uploaded $(basename "$src") → SF:$dest_path"
                  echo "RYU_LINK=https://sourceforge.net/projects/projectzk/files/ProjectRYU/${dest_path}" >> $GITHUB_ENV
                } || echo "::warning::rsync failed → $dest_path"
              rm -f key
            fi
          }

          # Google Drive upload function
          gd_upload() {
            local folder_id="$1"
            if [ -n "${{ secrets.TOKEN_PICKLE2 }}" ] && [ -n "${{ secrets.UPLOADER }}" ]; then
              echo "${{ secrets.TOKEN_PICKLE2 }}" | base64 -d > token.pickle
              echo "${{ secrets.UPLOADER }}" | base64 -d > upload.py
              chmod 0600 token.pickle upload.py
              python upload.py --folder-id "$folder_id" "$ROM_OUTPUT" || echo "::warning::GDrive upload failed"
              rm -f token.pickle upload.py
            fi
          }

          if [ "$IS_GLOBAL" = "true" ]; then
            SF_PATH="RYU-MI"
            GD_FOLDER="1xODr-0Y04OavIfSZJd7rtptOYQTpax8J"
          else
            SF_PATH="RYU-CN"
            GD_FOLDER="1Xq5UYwKHr4J6ad7Xef3MBpKek5yTk2cL"
          fi

          # Always upload to PixelDrain when API key is available
          pd_upload

          # Upload to SourceForge / GDrive if configured
          sf_upload "$ROM_OUTPUT" "$SF_PATH"
          gd_upload "$GD_FOLDER"

      - name: Telegram Notification
        if: env.RYU_LINK != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] || exit 0
          PAYLOAD=$(jq -n \
            --arg chat "-1002030539146" \
            --arg text "✅ <b>NEW BUILD: <a href='${RYU_LINK}'>${RYU_NAME}.zip</a></b>" \
            '{ chat_id: $chat, text: $text, parse_mode: "HTML" }')
          curl -s -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
